[package]
name = "nema-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.17.2"
serde_json = "1"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.17.2", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.clippy]
# `new` takes the deployment settings one by one; #[near] wraps it in generated
# code an inline allow does not reach.
too_many_arguments = "allow"
