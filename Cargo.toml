# Only the enclave module lives in this workspace, so `cargo build --release
# --target wasm32-wasip2` at the repository root builds it. That is how OutLayer
# compiles a project straight from this repository. The contract builds on its
# own (contract/build.sh).
[workspace]
members = ["aggregator"]
exclude = ["contract", "interop", "web"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
