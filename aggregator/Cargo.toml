[package]
name = "nema-aggregator"
version = "0.1.0"
edition = "2021"

[dependencies]
ecies = { version = "0.2.14", default-features = false, features = ["pure", "std"] }
hex = "0.4.3"
hkdf = "0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"

[[bin]]
name = "nema-aggregator"
path = "src/main.rs"

