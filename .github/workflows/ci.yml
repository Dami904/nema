name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.96.0"
  CARGO_TERM_COLOR: always

jobs:
  # Each web check is its own job, so a lint failure never hides a test failure.
  web:
    name: web ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: ./build.sh

  # The enclave source is frozen: any edit changes the wasm hash the secret lock
  # pins, so it is not reformatted and fmt is not checked here.
  enclave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p nema-aggregator --all-targets -- -D warnings
      - run: cargo test -p nema-aggregator
      - run: cargo build -p nema-aggregator --release --target wasm32-wasip2

  # The deployed builds embed the builder's Cargo registry path in panic
  # messages, so their hashes reproduce only on Windows with this Cargo home.
  reproduce:
    runs-on: windows-latest
    env:
      CARGO_HOME: C:\Users\USER\.cargo
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p "$CARGO_HOME"
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-wasip2 --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - name: Enclave wasm matches the hash the secret lock pins
        run: |
          cargo build -p nema-aggregator --release --target wasm32-wasip2
          pinned=$(sed -nE 's/.*enclaveWasmSha256: "([0-9a-f]{64})".*/\1/p' web/src/lib/config.ts)
          built=$(sha256sum target/wasm32-wasip2/release/nema-aggregator.wasm | cut -d' ' -f1)
          echo "pinned $pinned"; echo "built  $built"
          test -n "$pinned" && test "$pinned" = "$built"
      - name: Contract wasm matches the deployed hash
        run: |
          ./contract/build.sh
          pinned=$(sed -nE 's/.*contractWasmSha256: "([0-9a-f]{64})".*/\1/p' web/src/lib/config.ts)
          built=$(sha256sum contract/res/nema_contract.wasm | cut -d' ' -f1)
          echo "pinned $pinned"; echo "built  $built"
          test -n "$pinned" && test "$pinned" = "$built"

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No environment files committed
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$found" ]; then echo "committed env files: $found"; exit 1; fi
      - name: No NEAR private keys committed
        # A secret key is 64 bytes, so its base58 runs past 80 characters; public keys are about 44.
        run: |
          if git grep -nE 'ed25519:[1-9A-HJ-NP-Za-km-z]{80,}'; then exit 1; fi
      - name: Pinned hashes agree across config and docs
        run: |
          for name in enclaveWasmSha256 contractWasmSha256; do
            h=$(sed -nE "s/.*$name: \"([0-9a-f]{64})\".*/\1/p" web/src/lib/config.ts)
            echo "$name $h"
            test -n "$h" || { echo "no $name in config.ts"; exit 1; }
            grep -q "$h" README.md || { echo "README.md does not mention $name $h"; exit 1; }
          done
