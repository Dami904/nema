name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Rust version, components and targets come from rust-toolchain.toml.
env:
  CARGO_TERM_COLOR: always

jobs:
  # Each web check is its own job, so a lint failure never hides a test failure.
  web:
    name: web ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash build.sh

  # The enclave source is frozen: any edit changes the wasm hash the secret lock
  # pins, so it is not reformatted and fmt is not checked here.
  enclave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p nema-aggregator --all-targets -- -D warnings
      - run: cargo test --locked -p nema-aggregator
      - run: cargo build --locked -p nema-aggregator --release --target wasm32-wasip2

  # The deployed enclave is built in the pinned container aggregator/build.sh
  # names, so its hash reproduces anywhere Docker runs.
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enclave wasm matches the hash the secret lock pins
        run: |
          built=$(bash aggregator/build.sh | tail -1 | cut -d' ' -f1)
          pinned=$(sed -nE 's/.*enclaveWasmSha256: "([0-9a-f]{64})".*/\1/p' web/src/lib/config.ts)
          echo "pinned $pinned"; echo "built  $built"
          test -n "$pinned" && test "$pinned" = "$built"

  # The contract is built in the container its Cargo.toml names, the one SourceScan
  # uses, so this runs anywhere Docker does. The build embeds the commit it came
  # from (NEP-330), so the check rebuilds that commit, not HEAD.
  contract-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - name: The contract source is still the deployed one
        # The deployed build came from contractSourceRev. Any later edit to the
        # contract means a new deploy, so its rev and hash must be bumped with it.
        # Unit tests are not in the wasm, so they may grow without one.
        run: |
          rev=$(sed -nE 's/.*contractSourceRev: "([0-9a-f]{40})".*/\1/p' web/src/lib/config.ts)
          git diff --exit-code "$rev" HEAD -- contract/Cargo.toml contract/Cargo.lock contract/src ':(exclude)contract/src/tests.rs'
      - name: Install cargo-near 0.21.1
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO https://github.com/near/cargo-near/releases/download/cargo-near-v0.21.1/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          echo "7c63b0a7367e16d5b30ab0764eb1907e49333d48388ada31656ee0cfd181d89e  cargo-near-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c
          tar xzf cargo-near-x86_64-unknown-linux-gnu.tar.gz
          echo "$RUNNER_TEMP/cargo-near-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Contract wasm matches the deployed hash
        run: |
          rev=$(sed -nE 's/.*contractSourceRev: "([0-9a-f]{40})".*/\1/p' web/src/lib/config.ts)
          pinned=$(sed -nE 's/.*contractWasmSha256: "([0-9a-f]{64})".*/\1/p' web/src/lib/config.ts)
          test -n "$rev" && test -n "$pinned"
          git checkout --detach "$rev"
          cd contract
          cargo-near near build reproducible-wasm
          built=$(sha256sum target/near/nema_contract.wasm | cut -d' ' -f1)
          echo "rev    $rev"; echo "pinned $pinned"; echo "built  $built"
          test "$pinned" = "$built"

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No environment files committed
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$found" ]; then echo "committed env files: $found"; exit 1; fi
      - name: No NEAR private keys committed
        # A secret key is 64 bytes, so its base58 runs past 80 characters; public keys are about 44.
        run: |
          if git grep -nE 'ed25519:[1-9A-HJ-NP-Za-km-z]{80,}'; then exit 1; fi
      - name: No other private keys committed
        # testdata/interop/rust.json holds a throwaway key made for the test vectors.
        run: |
          if git grep -nE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----'; then exit 1; fi
          if git grep -niE '"[a-z_]*(secret|private|_sk|seed)[a-z_]*"[[:space:]]*:[[:space:]]*"(0x)?[0-9a-f]{64}' -- ':!testdata/interop/rust.json'; then exit 1; fi
      - name: Pinned hashes agree across config and docs
        run: |
          for name in enclaveWasmSha256 contractWasmSha256; do
            h=$(sed -nE "s/.*$name: \"([0-9a-f]{64})\".*/\1/p" web/src/lib/config.ts)
            echo "$name $h"
            test -n "$h" || { echo "no $name in config.ts"; exit 1; }
            grep -q "$h" README.md || { echo "README.md does not mention $name $h"; exit 1; }
          done
          rev=$(sed -nE 's/.*contractSourceRev: "([0-9a-f]{40})".*/\1/p' web/src/lib/config.ts)
          echo "contractSourceRev $rev"
          test -n "$rev" || { echo "no contractSourceRev in config.ts"; exit 1; }
          grep -q "$rev" README.md || { echo "README.md does not link contractSourceRev $rev"; exit 1; }
          grep -q "${rev:0:7}" DESIGN.md || { echo "DESIGN.md does not name ${rev:0:7}"; exit 1; }
